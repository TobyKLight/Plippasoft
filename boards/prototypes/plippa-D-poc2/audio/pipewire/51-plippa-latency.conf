# Plippa audio latency (AUDIO_OPS_01).
#
# Installed to /etc/pipewire/pipewire.conf.d/ and read when PipeWire starts.
# The stock quantum is 1024 frames = 21 ms at 48 kHz before any sink buffer is
# added; 256 frames is 5.3 ms. AUDIO_03's local-only target cannot be reached at
# 1024. This is a global setting: every client on the device gets it, and CPU
# cost rises. If pw-top shows xruns on the DSP thread, step up to 512 and record
# the kept value here and in docs/design/architecture.md.
context.properties = {
    default.clock.quantum     = 256
    default.clock.min-quantum = 64
    default.clock.max-quantum = 1024
}
