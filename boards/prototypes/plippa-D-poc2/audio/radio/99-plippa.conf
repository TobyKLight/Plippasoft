# Plippa radio identity and boot-time power (AUDIO_OPS_01).
#
# Installed to /etc/bluetooth/main.conf.d/99-plippa.conf. Name is what an
# accessory shows in its list. AutoEnable is belt-and-braces: the app powers
# the adapter itself (ACC_02 §4.2). We are the initiator and never the acceptor,
# so Discoverable stays at its default (off).
#
# BR/EDR only (SYS-03, owner answer 2026-11-08): no supported accessory pairs
# over BLE, and the agent policy only knows the classic pairing flows. BLE
# accessories are NOT supported until the owner decides otherwise.
[General]
Name = Plippa
ControllerMode = bredr

[Policy]
AutoEnable = true
